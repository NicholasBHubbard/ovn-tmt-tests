- name: Apply initial OVS external IDs
  hosts: all
  become: true
  pre_tasks:
    - name: Add unmanaged OVS external ID
      ansible.builtin.command:
        argv:
          - ovs-vsctl
          - set
          - Open_vSwitch
          - .
          - 'external_ids:self-unmanaged="preserve"'
      changed_when: true
  roles:
    - role: ovs_external_ids
      ovs_external_ids:
        self-managed: initial
        self-delete: remove-me
        self-empty: ""
        self-uuid: "01234567-89ab-cdef-0123-456789abcdef"
        self-boolean-text: "true"
        self-special key: 'spaces, commas = and "quotes"'
