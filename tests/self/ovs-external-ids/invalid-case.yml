- name: Require rejection of {{ ovs_external_ids_negative_case.name }}
  block:
    - name: Apply invalid OVS external ID configuration
      ansible.builtin.include_role:
        name: ovs_external_ids
      vars:
        ovs_external_ids: "{{ ovs_external_ids_negative_case.external_ids }}"

    - name: Fail if invalid configuration was accepted
      ansible.builtin.fail:
        msg: >-
          Invalid configuration was accepted:
          {{ ovs_external_ids_negative_case.name }}
  rescue:
    - name: Verify expected OVS external ID validation failure
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_result.msg
            == 'OVS external ID configuration is invalid.'
            or
            ansible_failed_result.results | default([])
            | selectattr(
                'msg',
                'equalto',
                'OVS external ID configuration is invalid.'
              )
            | list | length > 0
        fail_msg: >-
          {{ ovs_external_ids_negative_case.name }} failed unexpectedly:
          {{ ansible_failed_result.msg }}
