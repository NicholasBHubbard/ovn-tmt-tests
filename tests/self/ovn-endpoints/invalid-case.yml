- name: Require rejection of {{ ovn_endpoint_negative_case.name }}
  block:
    - name: Apply invalid OVN endpoint configuration
      ansible.builtin.include_role:
        name: ovn_endpoints
      vars:
        ovn_endpoints_mode: "{{ ovn_endpoint_negative_case.mode | default('local') }}"
        ovn_endpoints: "{{ ovn_endpoint_negative_case.endpoints }}"

    - name: Fail if invalid configuration was accepted
      ansible.builtin.fail:
        msg: >-
          Invalid configuration was accepted:
          {{ ovn_endpoint_negative_case.name }}
  rescue:
    - name: Verify expected validation failure
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_result.msg == ovn_endpoint_negative_case.message
            or
            ansible_failed_result.results | default([])
            | selectattr('msg', 'equalto', ovn_endpoint_negative_case.message)
            | list | length == 1
        fail_msg: >-
          {{ ovn_endpoint_negative_case.name }} failed for an unexpected reason:
          {{ ansible_failed_result.msg }}
