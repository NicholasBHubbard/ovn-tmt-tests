- name: Remove Southbound convergence fixtures
  hosts: all
  become: true
  tasks:
    - name: Remove logical switch
      ansible.builtin.command:
        argv:
          - ovn-nbctl
          - --if-exists
          - ls-del
          - self-convergence
      changed_when: true

- name: Wait for absent Southbound objects
  hosts: all
  become: true
  pre_tasks:
    - name: Write Southbound convergence expectations
      ansible.builtin.copy:
        dest: /tmp/ovn-sb-convergence-state.json
        mode: "0600"
        content: |
          {
            "southbound": {
              "absent_datapaths": ["self-convergence"],
              "absent_ports": ["self-convergence-port"]
            }
          }
  roles:
    - role: ovn_sb_convergence
      ovn_sb_convergence_state_path: /tmp/ovn-sb-convergence-state.json
  post_tasks:
    - name: Remove Southbound convergence expectations
      ansible.builtin.file:
        path: /tmp/ovn-sb-convergence-state.json
        state: absent
