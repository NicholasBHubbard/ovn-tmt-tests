- name: Require rejection of {{ ovn_gateway_chassis_negative_case.name }}
  block:
    - name: Apply invalid gateway chassis configuration
      ansible.builtin.include_role:
        name: ovn_gateway_chassis
      vars:
        ovn_gateway_chassis: >-
          {{ ovn_gateway_chassis_negative_case.assignments }}

    - name: Fail if invalid configuration was accepted
      ansible.builtin.fail:
        msg: >-
          Invalid configuration was accepted:
          {{ ovn_gateway_chassis_negative_case.name }}
  rescue:
    - name: Verify expected validation failure
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_result.msg
            == 'Gateway chassis configuration is invalid.'
            or
            ansible_failed_result.results | default([])
            | selectattr(
                'msg',
                'equalto',
                'Gateway chassis configuration is invalid.'
              )
            | list | length == 1
        fail_msg: >-
          {{ ovn_gateway_chassis_negative_case.name }} failed unexpectedly:
          {{ ansible_failed_result.msg }}
