- name: Require rejection of {{ ovn_static_route_negative_case.name }}
  block:
    - name: Apply invalid logical static route configuration
      ansible.builtin.include_role:
        name: ovn_static_routes
      vars:
        ovn_static_routes: "{{ ovn_static_route_negative_case.static_routes }}"

    - name: Fail if invalid configuration was accepted
      ansible.builtin.fail:
        msg: >-
          Invalid configuration was accepted:
          {{ ovn_static_route_negative_case.name }}
  rescue:
    - name: Verify expected validation failure
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_result.msg
            == 'Logical static route configuration is invalid.'
            or
            ansible_failed_result.results | default([])
            | selectattr(
                'msg',
                'equalto',
                'Logical static route configuration is invalid.'
              )
            | list | length == 1
        fail_msg: >-
          {{ ovn_static_route_negative_case.name }} failed unexpectedly:
          {{ ansible_failed_result.msg }}
