- name: Reapply changed topology
  ansible.builtin.import_playbook: reconfigure.yml

- name: Verify unchanged topology reapplication
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify managed configuration was unchanged
      ansible.builtin.assert:
        that:
          - not ovn_routers_updated
          - not ovn_localnet_ports_updated
          - not ovn_router_ports_updated
          - not ovn_nat_rules_updated
          - not ovn_load_balancers_updated
        fail_msg: "Identical topology configuration reported a change."
