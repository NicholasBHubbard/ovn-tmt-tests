- name: Require rejection of {{ ovn_switch_negative_case.name }}
  block:
    - name: Apply invalid logical switch configuration
      ansible.builtin.include_role:
        name: ovn_switches
      vars:
        ovn_switches: "{{ ovn_switch_negative_case.switches }}"

    - name: Fail if invalid configuration was accepted
      ansible.builtin.fail:
        msg: >-
          Invalid configuration was accepted:
          {{ ovn_switch_negative_case.name }}
  rescue:
    - name: Verify expected validation failure
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_result.msg
            == 'Logical switch configuration is invalid.'
            or
            ansible_failed_result.results | default([])
            | selectattr(
                'msg',
                'equalto',
                'Logical switch configuration is invalid.'
              )
            | list | length == 1
        fail_msg: >-
          {{ ovn_switch_negative_case.name }} failed unexpectedly:
          {{ ansible_failed_result.msg }}
