- name: Require rejection of {{ ovn_nat_negative_case.name }}
  block:
    - name: Apply invalid NAT rule configuration
      ansible.builtin.include_role:
        name: ovn_nat
      vars:
        ovn_nat_rules: "{{ ovn_nat_negative_case.nat_rules }}"

    - name: Fail if invalid configuration was accepted
      ansible.builtin.fail:
        msg: >-
          Invalid configuration was accepted:
          {{ ovn_nat_negative_case.name }}
  rescue:
    - name: Verify expected validation failure
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_result.msg
            == 'NAT rule configuration is invalid.'
            or
            ansible_failed_result.results | default([])
            | selectattr(
                'msg',
                'equalto',
                'NAT rule configuration is invalid.'
              )
            | list | length == 1
        fail_msg: >-
          {{ ovn_nat_negative_case.name }} failed unexpectedly:
          {{ ansible_failed_result.msg }}
