- name: Reject invalid OVS setup configuration
  hosts: all
  become: true
  tasks:
    - name: Verify invalid OVS bridge configurations are rejected
      ansible.builtin.include_tasks: invalid-case.yml
      loop:
        - name: non-list configuration
          bridges: invalid
        - name: unsupported entry
          bridges:
            - 1
        - name: missing name
          bridges:
            - state: absent
        - name: non-string name
          bridges:
            - name: 1
        - name: empty name
          bridges:
            - name: ""
        - name: invalid state
          bridges:
            - name: self-invalid
              state: invalid
        - name: duplicate names
          bridges:
            - self-duplicate
            - name: self-duplicate
              state: absent
        - name: later invalid entry
          bridges:
            - self-bridge-validation-safety
            - name: self-invalid
              state: invalid
      loop_control:
        loop_var: ovs_bridge_negative_case
        label: "{{ ovs_bridge_negative_case.name }}"

    - name: Reject missing OVS SSL files
      block:
        - name: Apply missing OVS SSL files
          ansible.builtin.include_role:
            name: ovs_setup
          vars:
            ovs_setup_ssl_enabled: true
            ovs_setup_ssl_private_key: /missing/private-key.pem
            ovs_setup_ssl_certificate: /missing/certificate.pem
            ovs_setup_ssl_ca_cert: /missing/ca-cert.pem

        - name: Fail if missing OVS SSL files were accepted
          ansible.builtin.fail:
            msg: "Missing OVS SSL files were accepted."
      rescue:
        - name: Verify expected OVS SSL file validation failure
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.msg
                == 'OVS SSL files must exist and be regular files.'
            fail_msg: >-
              Missing OVS SSL files failed unexpectedly:
              {{ ansible_failed_result.msg }}
