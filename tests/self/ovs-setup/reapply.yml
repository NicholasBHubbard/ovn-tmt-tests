- name: Reapply reusable OVS state
  ansible.builtin.import_playbook: disable.yml

- name: Verify identical OVS setup configuration is unchanged
  hosts: all
  become: true
  tasks:
    - name: Verify OVS setup was unchanged
      ansible.builtin.assert:
        that:
          - not ovs_setup_updated
          - not ovs_bridges_updated
