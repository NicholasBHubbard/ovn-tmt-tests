- name: Set up OVN central
  hosts: central:central-follower
  become: true
  pre_tasks:
    - name: Skip unused central followers
      when:
        - inventory_hostname in (groups['central-follower'] | default([]))
        - not (ovn_multihost_clustered | default(false) | bool)
      ansible.builtin.meta: end_host

    - name: Initialize OVN central cluster members
      ansible.builtin.set_fact:
        ovn_central_cluster_members: []
      tags: topology-resolution

    - name: Build OVN central cluster members
      when: ovn_multihost_clustered | default(false) | bool
      ansible.builtin.set_fact:
        ovn_central_cluster_members: >-
          {{ ovn_central_cluster_members
             + [hostvars[item]['ovn_central_address']
                | default(hostvars[item]['ansible_host'] | default(item))] }}
      loop: >-
        {{ groups['central'] | default([])
           + (groups['central-follower'] | default([])
              if ovn_multihost_clustered | default(false) | bool
              else []) }}
      tags: topology-resolution
  roles:
    - ovn_install
    - ovs_setup
    - role: ovn_central
      ovn_central_nb_port: "{{ ovn_multihost_nb_port | default(6641) }}"
      ovn_central_sb_port: "{{ ovn_multihost_sb_port | default(6642) }}"
      ovn_central_nb_raft_port: >-
        {{ ovn_multihost_nb_raft_port | default(6643) }}
      ovn_central_sb_raft_port: >-
        {{ ovn_multihost_sb_raft_port | default(6644) }}
      ovn_central_listen_address: >-
        {{ ovn_multihost_central_listen_address | default('0.0.0.0') }}
      ovn_central_cluster_join_timeout: >-
        {{ ovn_multihost_sb_wait_timeout | default(2700) }}
      ovn_central_ready_timeout: >-
        {{ ovn_multihost_sb_wait_timeout | default(2700) }}
      ovn_central_reconcile_cluster_members: >-
        {{ ovn_multihost_reconcile_cluster_members | default(true) | bool }}
      ovn_central_log_level: >-
        {{ ovn_multihost_central_log_level | default('info') }}
      ovn_central_ssl_enabled: >-
        {{ ovn_multihost_ssl_enabled | default(false) | bool }}
      ovn_central_ssl_private_key: >-
        {{ ovn_multihost_ssl_private_key
           | default((ovn_multihost_pki_dir | default('/run/ovn-test-pki'))
                     ~ '/private-key.pem') }}
      ovn_central_ssl_certificate: >-
        {{ ovn_multihost_ssl_certificate
           | default((ovn_multihost_pki_dir | default('/run/ovn-test-pki'))
                     ~ '/certificate.pem') }}
      ovn_central_ssl_ca_cert: >-
        {{ ovn_multihost_ssl_ca_cert
           | default((ovn_multihost_pki_dir | default('/run/ovn-test-pki'))
                     ~ '/ca-cert.pem') }}

- name: Resolve central for OVN chassis
  hosts: compute:gateway
  gather_facts: false
  tasks:
    - name: Initialize central endpoint lists
      ansible.builtin.set_fact:
        ovn_central_addresses: []
        ovn_central_sb_remotes: []
      tags: topology-resolution

    - name: Build central address list
      ansible.builtin.set_fact:
        ovn_central_addresses: >-
          {{ ovn_central_addresses
             + [hostvars[item]['ovn_central_address']
                | default(hostvars[item]['ansible_host'] | default(item))] }}
      loop: >-
        {{ groups['central'] | default([])
           + (groups['central-follower'] | default([])
              if ovn_multihost_clustered | default(false) | bool
              else []) }}
      tags: topology-resolution

    - name: Resolve central address
      ansible.builtin.set_fact:
        ovn_central_address: "{{ ovn_central_addresses[0] }}"
      tags: topology-resolution

    - name: Build central Southbound remote list
      ansible.builtin.set_fact:
        ovn_central_sb_remotes: >-
          {{ ovn_central_sb_remotes
             + [ovn_central_protocol ~ ':' ~ ovn_central_remote_address ~ ':'
                ~ (ovn_multihost_sb_port | default(6642) | string)] }}
      vars:
        ovn_central_protocol: >-
          {{ 'ssl'
             if ovn_multihost_ssl_enabled | default(false) | bool
             else 'tcp' }}
        ovn_central_remote_address: >-
          {{ '[' ~ (item | string) ~ ']'
             if ':' in (item | string) and (item | string)[0] != '['
             else (item | string) }}
      loop: "{{ ovn_central_addresses }}"
      tags: topology-resolution

    - name: Wait for every SB database endpoint
      ansible.builtin.wait_for:
        host: "{{ item }}"
        port: "{{ ovn_multihost_sb_port | default(6642) }}"
        timeout: "{{ ovn_multihost_sb_wait_timeout | default(2700) }}"
      loop: "{{ ovn_central_addresses }}"

- name: Set up OVN chassis on compute nodes
  hosts: compute
  become: true
  roles:
    - ovn_install
    - role: ovs_setup
      ovs_setup_ssl_enabled: >-
        {{ ovn_multihost_ssl_enabled | default(false) | bool }}
      ovs_setup_ssl_private_key: >-
        {{ ovn_multihost_ssl_private_key
           | default((ovn_multihost_pki_dir | default('/run/ovn-test-pki'))
                     ~ '/private-key.pem') }}
      ovs_setup_ssl_certificate: >-
        {{ ovn_multihost_ssl_certificate
           | default((ovn_multihost_pki_dir | default('/run/ovn-test-pki'))
                     ~ '/certificate.pem') }}
      ovs_setup_ssl_ca_cert: >-
        {{ ovn_multihost_ssl_ca_cert
           | default((ovn_multihost_pki_dir | default('/run/ovn-test-pki'))
                     ~ '/ca-cert.pem') }}
    - ovn_chassis
  vars:
    ovn_chassis_sb_port: "{{ ovn_multihost_sb_port | default(6642) }}"
    ovn_chassis_name: "{{ inventory_hostname }}"
    ovn_chassis_integration_bridge: >-
      {{ ovn_multihost_integration_bridge | default('br-int') }}
    ovn_chassis_ready_timeout: >-
      {{ ovn_multihost_sb_wait_timeout | default(2700) }}
    ovn_chassis_monitor_all: >-
      {{ ovn_multihost_monitor_all | default(false) | bool }}
    ovn_chassis_bridges: >-
      {{ [ovn_compute_physical_bridge]
         if ovn_compute_physical_bridge | default('') | length > 0
         else [] }}
    ovn_chassis_bridge_mappings: >-
      {{ (ovn_compute_physical_network ~ ':' ~ ovn_compute_physical_bridge)
         if ovn_compute_physical_network | default('') | length > 0
         and ovn_compute_physical_bridge | default('') | length > 0
         else '' }}
    ovn_chassis_remote: "{{ ovn_central_sb_remotes | join(',') }}"

- name: Set up OVN chassis on gateway nodes
  hosts: gateway
  become: true
  roles:
    - ovn_install
    - role: ovs_setup
      ovs_setup_ssl_enabled: >-
        {{ ovn_multihost_ssl_enabled | default(false) | bool }}
      ovs_setup_ssl_private_key: >-
        {{ ovn_multihost_ssl_private_key
           | default((ovn_multihost_pki_dir | default('/run/ovn-test-pki'))
                     ~ '/private-key.pem') }}
      ovs_setup_ssl_certificate: >-
        {{ ovn_multihost_ssl_certificate
           | default((ovn_multihost_pki_dir | default('/run/ovn-test-pki'))
                     ~ '/certificate.pem') }}
      ovs_setup_ssl_ca_cert: >-
        {{ ovn_multihost_ssl_ca_cert
           | default((ovn_multihost_pki_dir | default('/run/ovn-test-pki'))
                     ~ '/ca-cert.pem') }}
    - ovn_chassis
  vars:
    ovn_chassis_sb_port: "{{ ovn_multihost_sb_port | default(6642) }}"
    ovn_chassis_remote: "{{ ovn_central_sb_remotes | join(',') }}"
    ovn_chassis_monitor_all: >-
      {{ ovn_multihost_monitor_all | default(false) | bool }}
    ovn_chassis_integration_bridge: >-
      {{ ovn_multihost_integration_bridge | default('br-int') }}
    ovn_chassis_ready_timeout: >-
      {{ ovn_multihost_sb_wait_timeout | default(2700) }}
    ovn_chassis_name: >-
      {{ ovn_gateway_chassis_name | default(inventory_hostname, true) }}
    ovn_chassis_bridges: >-
      {{ ((ovn_gateway_bridges | from_yaml) or [])
         if ovn_gateway_bridges is defined and ovn_gateway_bridges is string
         else ovn_gateway_bridges | default(['br-ex']) }}
    ovn_chassis_bridge_mappings: >-
      {{ ovn_gateway_bridge_mappings | default('public:br-ex') }}
    ovn_chassis_cms_options: >-
      {{ ((ovn_gateway_cms_options | from_yaml) or [])
         if ovn_gateway_cms_options is defined and ovn_gateway_cms_options is string
         else ovn_gateway_cms_options | default(['enable-chassis-as-gw']) }}
