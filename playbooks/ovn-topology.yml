- name: Configure OVN topology
  hosts: "{{ ovn_topology_central_hosts | default('central') }}"
  become: true
  roles:
    - role: ovn_switches
      vars:
        ovn_switches_defer_absent: true
    - ovn_dhcp_options
    - ovn_localnet_ports
    - ovn_routers
    - ovn_router_ports
    - ovn_gateway_chassis
    - ovn_nat
    - ovn_static_routes
    - ovn_load_balancers
    - ovn_load_balancer_groups
    - ovn_acls
  post_tasks:
    - name: Remove logical switches after dependent topology
      ansible.builtin.include_role:
        name: ovn_switches
        tasks_from: absent
