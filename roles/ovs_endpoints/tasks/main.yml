- name: Verify OVS endpoint configuration
  ansible.builtin.assert:
    that:
      - ovs_endpoints is sequence
      - ovs_endpoints is not string
      - ovs_endpoints is not mapping
      - ovs_endpoints_mtu is integer
      - ovs_endpoints_mtu > 0
    fail_msg: "OVS endpoint configuration is invalid."

- name: Verify OVS endpoint definitions
  ansible.builtin.include_tasks: validate.yml
  loop: "{{ ovs_endpoints }}"
  loop_control:
    loop_var: ovs_endpoint
    label: >-
      {{ ovs_endpoint.name | default('unnamed')
         if ovs_endpoint is mapping else 'invalid' }}

- name: Verify OVS endpoint names are unique
  ansible.builtin.assert:
    that:
      - >-
        ovs_endpoints | map(attribute='name') | unique | length
        == ovs_endpoints | length
    fail_msg: "OVS endpoint configuration is invalid."

- name: Verify destination OVS bridges
  when:
    - ovs_endpoint.state | default('present') == 'present'
    - ovs_endpoint.host == inventory_hostname
  ansible.builtin.include_tasks: preflight.yml
  loop: "{{ ovs_endpoints }}"
  loop_control:
    loop_var: ovs_endpoint
    label: "{{ ovs_endpoint.name }}"

- name: Initialize OVS endpoint update state
  ansible.builtin.set_fact:
    ovs_endpoints_updated: false
  changed_when: false

- name: Remove absent or moved OVS endpoints
  when:
    - >-
      ovs_endpoint.state | default('present') == 'absent'
      or ovs_endpoint.host | default('') != inventory_hostname
  ansible.builtin.include_tasks: cleanup.yml
  loop: "{{ ovs_endpoints }}"
  loop_control:
    loop_var: ovs_endpoint
    label: "{{ ovs_endpoint.name }}"

- name: Configure direct OVS endpoints
  when:
    - ovs_endpoint.state | default('present') == 'present'
    - ovs_endpoint.host == inventory_hostname
  ansible.builtin.include_tasks: endpoint.yml
  loop: "{{ ovs_endpoints }}"
  loop_control:
    loop_var: ovs_endpoint
    label: "{{ ovs_endpoint.name }}"
