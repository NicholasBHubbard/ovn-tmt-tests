- name: Verify install method is valid
  ansible.builtin.assert:
    that:
      - ovn_install_method in ["source", "git", "distro", "package", "artifact"]
    fail_msg: >-
      Unknown ovn_install_method '{{ ovn_install_method }}'.
      Valid: source, git, distro, package, artifact.

- name: Install OVN from source
  when:
    - ovn_install_method == "source"
    - not (ovn_installed | default(false))
  ansible.builtin.include_tasks: source.yml

- name: Install OVN from git
  when:
    - ovn_install_method == "git"
    - not (ovn_installed | default(false))
  ansible.builtin.include_tasks: git.yml

- name: Install OVN from distro repos
  when:
    - ovn_install_method == "distro"
    - not (ovn_installed | default(false))
  ansible.builtin.include_tasks: distro.yml

- name: Install OVN from package files
  when:
    - ovn_install_method == "package"
    - not (ovn_installed | default(false))
  ansible.builtin.include_tasks: package.yml

- name: Install OVN from source artifact
  when:
    - ovn_install_method == "artifact"
    - not (ovn_installed | default(false))
  ansible.builtin.include_tasks: artifact.yml

- name: Verify OVS is installed
  when: ovn_install_destdir | length == 0
  ansible.builtin.command:
    argv:
      - "{{ ovn_install_ovs_binary }}"
      - --version
  loop:
    - ovs-vsctl
    - ovs-vswitchd
    - ovsdb-server
  loop_control:
    loop_var: ovn_install_ovs_binary
    label: "{{ ovn_install_ovs_binary }}"
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: false

- name: Resolve installed OVN paths
  when: ovn_install_destdir | length == 0
  ansible.builtin.include_tasks: paths.yml

- name: Mark OVN as installed
  when:
    - ovn_install_destdir | length == 0
    - not (ovn_installed | default(false))
  ansible.builtin.set_fact:
    ovn_installed: true
