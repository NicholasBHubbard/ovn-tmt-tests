- name: Verify OVN chassis configuration
  ansible.builtin.assert:
    that:
      - ovn_chassis_name | length > 0
      - ovn_chassis_name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - ovn_chassis_remote | length > 0
      - ovn_chassis_encap_type | length > 0
      - ovn_chassis_bridges is sequence
      - ovn_chassis_bridges is not string
      - ovn_chassis_cms_options is sequence
      - ovn_chassis_cms_options is not string
    fail_msg: "OVN chassis configuration is invalid."

- name: Verify OVN controller is installed
  ansible.builtin.command:
    cmd: which ovn-controller
  changed_when: false

- name: Verify OVS is running
  ansible.builtin.command:
    cmd: ovs-vsctl show
  changed_when: false

- name: Resolve chassis encapsulation address
  ansible.builtin.set_fact:
    ovn_chassis_effective_encap_ip: >-
      {{ ovn_chassis_encap_ip
         or ansible_facts['default_ipv4']['address'] }}
  changed_when: false

- name: Configure chassis OVS database
  ansible.builtin.include_tasks: configure.yml

- name: Gather service facts
  when: ansible_facts["service_mgr"] == 'systemd'
  ansible.builtin.service_facts:

- name: Set OVN controller service availability
  ansible.builtin.set_fact:
    ovn_chassis_has_controller_service: >-
      {{ ansible_facts["service_mgr"] == 'systemd'
         and 'ovn-controller.service'
             in (ansible_facts.services | default({})) }}
  changed_when: false

- name: Find OVN control script
  when: not ovn_chassis_has_controller_service
  ansible.builtin.find:
    paths:
      - /usr
      - /usr/local
    patterns: ovn-ctl
    file_type: file
    recurse: true
  register: ovn_chassis_ovn_ctl_find

- name: Verify OVN control script exists
  when: not ovn_chassis_has_controller_service
  ansible.builtin.assert:
    that:
      - ovn_chassis_ovn_ctl_find.files | length > 0
    fail_msg: "Could not find ovn-ctl under /usr or /usr/local."

- name: Start OVN controller via systemd
  when: ovn_chassis_has_controller_service
  ansible.builtin.service:
    name: ovn-controller
    state: started
    enabled: true

- name: Start OVN controller via control script
  when: not ovn_chassis_has_controller_service
  ansible.builtin.command:
    argv:
      - "{{ ovn_chassis_ovn_ctl_find.files[0].path }}"
      - start_controller
  changed_when: true

- name: Wait for OVN controller connection
  ansible.builtin.command:
    argv:
      - ovn-appctl
      - -t
      - ovn-controller
      - connection-status
  retries: 10
  delay: 2
  register: ovn_chassis_connected
  until: ovn_chassis_connected.stdout == "connected"
  changed_when: false
