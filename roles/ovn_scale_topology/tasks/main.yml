- name: Verify OVN scale topology configuration
  ansible.builtin.assert:
    that:
      - ovn_scale_topology_id | length > 0
      - ovn_scale_topology_worker_count | int > 0
      - ovn_scale_topology_workers is sequence
      - ovn_scale_topology_workers is not string
      - ovn_scale_topology_chassis is sequence
      - ovn_scale_topology_chassis is not string
      - ovn_scale_topology_physical_bridge | length > 0
      - ovn_scale_topology_physical_network | length > 0
    fail_msg: "Scale topology needs a stable ID and a positive worker count."

- name: Create temporary scale topology state file
  ansible.builtin.tempfile:
    state: file
    suffix: .json
  register: ovn_scale_topology_state

- name: Configure OVN scale topology
  block:
    - name: Generate OVN scale topology configuration
      ansible.builtin.script:
        cmd: generate.py
        executable: python3
      environment:
        OVN_SCALE_TOPOLOGY_CONFIG: >-
          {{ {
            'id': ovn_scale_topology_id,
            'worker_count': ovn_scale_topology_worker_count | int,
            'worker_prefix': ovn_scale_topology_worker_prefix,
            'workers': ovn_scale_topology_workers,
            'chassis': ovn_scale_topology_chassis,
            'ipv4': ovn_scale_topology_ipv4 | bool,
            'ipv6': ovn_scale_topology_ipv6 | bool,
            'internal_ipv4': ovn_scale_topology_internal_ipv4,
            'internal_ipv6': ovn_scale_topology_internal_ipv6,
            'external_ipv4': ovn_scale_topology_external_ipv4,
            'external_ipv6': ovn_scale_topology_external_ipv6,
            'join_ipv4': ovn_scale_topology_join_ipv4,
            'join_ipv6': ovn_scale_topology_join_ipv6,
            'cluster_ipv4': ovn_scale_topology_cluster_ipv4,
            'cluster_ipv6': ovn_scale_topology_cluster_ipv6,
            'cluster_router': ovn_scale_topology_cluster_router,
            'join_switch': ovn_scale_topology_join_switch,
            'load_balancer_group': ovn_scale_topology_load_balancer_group,
            'snat_ct_zone': ovn_scale_topology_snat_ct_zone,
            'physical_network': ovn_scale_topology_physical_network,
            'physical_bridge': ovn_scale_topology_physical_bridge
          } | to_json }}
        OVN_SCALE_TOPOLOGY_OUTPUT: "{{ ovn_scale_topology_state.path }}"
      changed_when: false

    - name: Apply OVN scale topology
      ansible.builtin.script:
        cmd: apply.py
        executable: python3
      environment:
        OVN_SCALE_TOPOLOGY_PATH: "{{ ovn_scale_topology_state.path }}"
      changed_when: true

    - name: Configure scale load balancer group
      ansible.builtin.include_role:
        name: ovn_load_balancer_groups
      vars:
        ovn_load_balancer_groups: []
        ovn_load_balancer_groups_path: "{{ ovn_scale_topology_state.path }}"

    - name: Wait for scale topology Southbound convergence
      ansible.builtin.include_role:
        name: ovn_sb_convergence
      vars:
        ovn_sb_convergence_state_path: "{{ ovn_scale_topology_state.path }}"
        ovn_sb_convergence_timeout: "{{ ovn_scale_topology_sb_timeout }}"
      when: ovn_scale_topology_wait_for_sb | bool

    - name: Create scale topology manifest directory
      ansible.builtin.file:
        path: "{{ ovn_scale_topology_manifest_path | dirname }}"
        state: directory
        mode: "0755"
      when: ovn_scale_topology_manifest_path | length > 0

    - name: Publish scale topology manifest
      ansible.builtin.copy:
        src: "{{ ovn_scale_topology_state.path }}"
        dest: "{{ ovn_scale_topology_manifest_path }}"
        remote_src: true
        mode: "0644"
      when: ovn_scale_topology_manifest_path | length > 0
  always:
    - name: Remove temporary scale topology state file
      ansible.builtin.file:
        path: "{{ ovn_scale_topology_state.path }}"
        state: absent
