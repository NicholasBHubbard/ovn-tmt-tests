# Workers may be generated from worker_count and worker_prefix, or supplied as
# an explicit list of names. Network bases advance by one equally-sized subnet
# per worker, matching ovn-scale-testing.
ovn_scale_topology_id: ovn-scale
ovn_scale_topology_worker_count: 2
ovn_scale_topology_worker_prefix: ovn-scale
ovn_scale_topology_workers: []
# Logical workers are assigned round-robin to these already-provisioned
# chassis. Empty preserves the one-worker/one-same-named-chassis model.
ovn_scale_topology_chassis: []
ovn_scale_topology_ipv4: true
ovn_scale_topology_ipv6: true
ovn_scale_topology_internal_ipv4: 16.0.0.0/16
ovn_scale_topology_internal_ipv6: 16::/64
ovn_scale_topology_external_ipv4: 20.0.0.0/16
ovn_scale_topology_external_ipv6: 20::/64
ovn_scale_topology_join_ipv4: 30.0.0.0/16
ovn_scale_topology_join_ipv6: 30::/64
ovn_scale_topology_cluster_ipv4: 16.0.0.0/4
ovn_scale_topology_cluster_ipv6: 16::/32
ovn_scale_topology_cluster_router: lr-cluster1
ovn_scale_topology_join_switch: ls-join1
ovn_scale_topology_load_balancer_group: cluster-lb-group1
ovn_scale_topology_snat_ct_zone: ""
ovn_scale_topology_physical_network: physnet
ovn_scale_topology_physical_bridge: br-ex
ovn_scale_topology_wait_for_sb: true
ovn_scale_topology_sb_timeout: 120
ovn_scale_topology_manifest_path: ""
