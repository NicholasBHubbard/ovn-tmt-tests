- name: Verify OVN central configuration
  ansible.builtin.assert:
    that:
      - (ovn_central_nb_port | int) in range(1, 65536)
      - (ovn_central_sb_port | int) in range(1, 65536)
      - (ovn_central_nb_raft_port | int) in range(1, 65536)
      - (ovn_central_sb_raft_port | int) in range(1, 65536)
      - (ovn_central_cluster_join_timeout | int) > 0
      - (ovn_central_ready_timeout | int) > 0
      - (ovn_central_ready_delay | int) > 0
      - >-
        [ovn_central_nb_port | int, ovn_central_sb_port | int,
         ovn_central_nb_raft_port | int, ovn_central_sb_raft_port | int]
        | unique | length == 4
      - >-
        ovn_central_cluster_members | unique | length
        == ovn_central_cluster_members | length
    fail_msg: "OVN central ports, timeouts, and cluster members must be valid."

- name: Verify OVN binaries are installed
  ansible.builtin.command:
    cmd: which ovn-northd
  changed_when: false

- name: Verify OVN install paths are available
  ansible.builtin.assert:
    that:
      - ovn_install_ovn_ctl_path | default('') | length > 0
      - ovn_install_nb_control_socket | default('') | length > 0
      - ovn_install_sb_control_socket | default('') | length > 0
    fail_msg: "Apply ovn_install before ovn_central in the same play."

- name: Resolve OVN central addresses
  ansible.builtin.set_fact:
    ovn_central_resolved_address: >-
      {{ (ovn_central_address
          | default(ansible_host | default(inventory_hostname))) | string }}
    ovn_central_ready_retries: >-
      {{ [(((ovn_central_ready_timeout | int)
            + (ovn_central_ready_delay | int) - 1)
           // (ovn_central_ready_delay | int)), 1] | max }}
    ovn_central_raft_protocol: >-
      {{ 'ssl' if ovn_central_ssl_enabled | bool else 'tcp' }}
  tags: topology-resolution

- name: Render OVN central addresses
  ansible.builtin.set_fact:
    ovn_central_rendered_address: >-
      {{ '[' ~ ovn_central_resolved_address ~ ']'
         if ':' in ovn_central_resolved_address
            and ovn_central_resolved_address[0] != '['
         else ovn_central_resolved_address }}
    ovn_central_rendered_listen_address: >-
      {{ '[' ~ ovn_central_listen_address ~ ']'
         if ':' in ovn_central_listen_address
            and ovn_central_listen_address[0] != '['
         else ovn_central_listen_address }}
    ovn_central_cluster_leader_address: >-
      {{ '[' ~ (ovn_central_cluster_members[0] | string) ~ ']'
         if ovn_central_cluster_members | length > 0
            and ':' in (ovn_central_cluster_members[0] | string)
            and (ovn_central_cluster_members[0] | string)[0] != '['
         else (ovn_central_cluster_members[0] | default('') | string) }}
    ovn_central_northd_nb_remotes: []
    ovn_central_northd_sb_remotes: []
    ovn_central_nb_raft_remotes: []
    ovn_central_sb_raft_remotes: []
  tags: topology-resolution

- name: Build OVN central remote lists
  when: ovn_central_cluster_members | length > 0
  ansible.builtin.set_fact:
    ovn_central_northd_nb_remotes: >-
      {{ ovn_central_northd_nb_remotes
         + [('ssl' if ovn_central_ssl_enabled | bool else 'tcp')
            ~ ':' ~ ovn_central_member_address ~ ':'
            ~ (ovn_central_nb_port | string)] }}
    ovn_central_northd_sb_remotes: >-
      {{ ovn_central_northd_sb_remotes
         + [('ssl' if ovn_central_ssl_enabled | bool else 'tcp')
            ~ ':' ~ ovn_central_member_address ~ ':'
            ~ (ovn_central_sb_port | string)] }}
    ovn_central_nb_raft_remotes: >-
      {{ ovn_central_nb_raft_remotes
         + [ovn_central_raft_protocol ~ ':' ~ ovn_central_member_address
            ~ ':' ~ (ovn_central_nb_raft_port | string)] }}
    ovn_central_sb_raft_remotes: >-
      {{ ovn_central_sb_raft_remotes
         + [ovn_central_raft_protocol ~ ':' ~ ovn_central_member_address
            ~ ':' ~ (ovn_central_sb_raft_port | string)] }}
  loop: "{{ ovn_central_cluster_members }}"
  vars:
    ovn_central_member_address: >-
      {{ '[' ~ (item | string) ~ ']'
         if ':' in (item | string) and (item | string)[0] != '['
         else (item | string) }}
  tags: topology-resolution

- name: Resolve OVN databases
  ansible.builtin.set_fact:
    ovn_central_databases:
      - id: nb
        name: NB
        control: ovn-nbctl
        socket: "{{ ovn_install_nb_control_socket }}"
        schema: OVN_Northbound
        client_port: "{{ ovn_central_nb_port }}"
        raft_port: "{{ ovn_central_nb_raft_port }}"
        listener: >-
          {{ ('pssl' if ovn_central_ssl_enabled | bool else 'ptcp')
             ~ ':' ~ (ovn_central_nb_port | string)
             ~ ':' ~ ovn_central_rendered_listen_address }}
        northd_remotes: "{{ ovn_central_northd_nb_remotes }}"
        raft_remotes: "{{ ovn_central_nb_raft_remotes }}"
      - id: sb
        name: SB
        control: ovn-sbctl
        socket: "{{ ovn_install_sb_control_socket }}"
        schema: OVN_Southbound
        client_port: "{{ ovn_central_sb_port }}"
        raft_port: "{{ ovn_central_sb_raft_port }}"
        listener: >-
          {{ ('pssl' if ovn_central_ssl_enabled | bool else 'ptcp')
             ~ ':' ~ (ovn_central_sb_port | string)
             ~ ':' ~ ovn_central_rendered_listen_address }}
        northd_remotes: "{{ ovn_central_northd_sb_remotes }}"
        raft_remotes: "{{ ovn_central_sb_raft_remotes }}"

- name: Verify this host belongs to the requested cluster
  when: ovn_central_cluster_members | length > 0
  ansible.builtin.assert:
    that:
      - ovn_central_resolved_address in ovn_central_cluster_members
    fail_msg: >-
      This host's ovn_central_address must appear in
      ovn_central_cluster_members.

- name: Verify OVS is running
  ansible.builtin.command:
    cmd: ovs-vsctl show
  changed_when: false

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Select OVN central service
  ansible.builtin.set_fact:
    ovn_central_service_name: >-
      {{ 'ovn-northd'
         if 'ovn-northd.service' in (ansible_facts.services | default({}))
         else 'ovn-central'
         if 'ovn-central.service' in (ansible_facts.services | default({}))
         else '' }}

- name: Configure standalone OVN central services
  when: ovn_central_cluster_members | length == 0
  ansible.builtin.include_tasks: standalone.yml

- name: Configure clustered OVN databases
  when: ovn_central_cluster_members | length > 0
  ansible.builtin.include_tasks: cluster.yml

- name: Wait for OVN databases to be ready
  ansible.builtin.command:
    cmd: >-
      {{ item.control }}
      {% if ovn_central_cluster_members | length > 0 %}--no-leader-only{% endif %}
      show
  loop: "{{ ovn_central_databases }}"
  loop_control:
    label: "{{ item.name }}"
  retries: "{{ ovn_central_ready_retries }}"
  delay: "{{ ovn_central_ready_delay }}"
  register: ovn_central_database_ready
  until: ovn_central_database_ready.rc == 0
  changed_when: false

- name: Configure OVN database listeners
  ansible.builtin.include_tasks: listeners.yml

- name: Reconcile OVN database cluster membership
  when: ovn_central_cluster_members | length > 0
  ansible.builtin.include_tasks: reconcile.yml

- name: Start clustered ovn-northd
  when: ovn_central_cluster_members | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ ovn_install_ovn_ctl_path }}
      --ovn-manage-ovsdb=no
      --ovn-northd-nb-db={{ ovn_central_northd_nb_remotes | join(',') }}
      --ovn-northd-sb-db={{ ovn_central_northd_sb_remotes | join(',') }}
      --ovn-northd-log="-vconsole:off -vfile:{{ ovn_central_log_level }}"
      {% if ovn_central_ssl_enabled | bool %}
      --ovn-northd-ssl-key={{ ovn_central_ssl_private_key }}
      --ovn-northd-ssl-cert={{ ovn_central_ssl_certificate }}
      --ovn-northd-ssl-ca-cert={{ ovn_central_ssl_ca_cert }}
      {% endif %}
      restart_northd
  changed_when: true

- name: Wait for ovn-northd database connections
  ansible.builtin.command:
    cmd: "ovn-appctl -t ovn-northd {{ item.id }}-connection-status"
  loop: "{{ ovn_central_databases }}"
  loop_control:
    label: "{{ item.name }}"
  register: ovn_central_northd_connection
  until: ovn_central_northd_connection.stdout | trim == 'connected'
  retries: "{{ ovn_central_ready_retries }}"
  delay: "{{ ovn_central_ready_delay }}"
  changed_when: false

- name: Apply ovn-northd log level
  ansible.builtin.command:
    argv:
      - ovn-appctl
      - -t
      - ovn-northd
      - vlog/set
      - "file:{{ ovn_central_log_level }}"
  changed_when: false
