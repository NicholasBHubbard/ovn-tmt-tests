- name: Stop service-managed standalone OVN central
  when: ovn_central_service_name | length > 0
  ansible.builtin.service:
    name: "{{ ovn_central_service_name }}"
    state: stopped
    enabled: false

- name: Open OVN Raft ports in firewall
  when:
    - "'firewalld.service' in (ansible_facts.services | default({}))"
    - "(ansible_facts.services['firewalld.service'].state | default('')) == 'running'"
  ansible.posix.firewalld:
    port: "{{ item.raft_port }}/tcp"
    state: enabled
    immediate: true
  loop: "{{ ovn_central_databases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for OVN cluster leader
  when: ovn_central_resolved_address != ovn_central_cluster_members[0]
  ansible.builtin.wait_for:
    host: "{{ ovn_central_cluster_members[0] }}"
    port: "{{ item.raft_port }}"
    timeout: "{{ ovn_central_cluster_join_timeout }}"
  loop: "{{ ovn_central_databases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start OVN clustered databases
  ansible.builtin.include_tasks: start-database.yml
  loop: "{{ ovn_central_databases }}"
  loop_control:
    loop_var: ovn_central_database
    label: "{{ ovn_central_database.name }}"
