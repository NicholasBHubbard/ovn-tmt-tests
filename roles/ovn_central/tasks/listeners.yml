- name: Open OVN database ports in firewall
  when:
    - "'firewalld.service' in (ansible_facts.services | default({}))"
    - "(ansible_facts.services['firewalld.service'].state | default('')) == 'running'"
  ansible.posix.firewalld:
    port: "{{ item.client_port }}/tcp"
    state: enabled
    immediate: true
  loop: "{{ ovn_central_databases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure OVN database SSL certificates
  when: ovn_central_ssl_enabled | bool
  ansible.builtin.command:
    cmd: >-
      {{ item.control }}
      {% if ovn_central_cluster_members | length > 0 %}--no-leader-only{% endif %}
      set-ssl {{ ovn_central_ssl_private_key }}
      {{ ovn_central_ssl_certificate }} {{ ovn_central_ssl_ca_cert }}
  loop: "{{ ovn_central_databases }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Configure standalone OVN database listeners
  when: ovn_central_cluster_members | length == 0
  ansible.builtin.command:
    argv:
      - "{{ item.control }}"
      - set-connection
      - "{{ item.listener }}"
  loop: "{{ ovn_central_databases }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Configure clustered OVN database listeners
  when: ovn_central_cluster_members | length > 0
  ansible.builtin.include_tasks: clustered-listeners.yml

- name: Clear OVN database SSL configuration
  when: not (ovn_central_ssl_enabled | bool)
  ansible.builtin.command:
    cmd: >-
      {{ item.control }}
      {% if ovn_central_cluster_members | length > 0 %}--no-leader-only{% endif %}
      del-ssl
  loop: "{{ ovn_central_databases }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
