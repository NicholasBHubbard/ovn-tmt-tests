- name: Validate OVS bridge configuration
  ansible.builtin.include_tasks: validate.yml

- name: Initialize OVS bridge update state
  ansible.builtin.set_fact:
    ovs_bridges_updated: false
  changed_when: false

- name: Configure OVS bridges
  ansible.builtin.include_tasks: bridge.yml
  loop: "{{ ovs_bridges }}"
  loop_control:
    loop_var: ovs_bridge
    label: "{{ ovs_bridge.name if ovs_bridge is mapping else ovs_bridge }}"
  vars:
    ovs_bridge_name: "{{ ovs_bridge.name if ovs_bridge is mapping else ovs_bridge }}"
    ovs_bridge_state: >-
      {{ ovs_bridge.state | default('present')
         if ovs_bridge is mapping else 'present' }}
