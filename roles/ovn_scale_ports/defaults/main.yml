# This role configures ports on the current chassis guest. start_index keeps
# generated names and MAC addresses unique when several guests share a topology.
# Explicit ports override generated ports for arbitrary local layouts.
ovn_scale_ports_id: ovn-scale-ports
ovn_scale_ports_count: 0
ovn_scale_ports_start_index: 0
ovn_scale_ports_port_prefix: ovn-scale-pod
ovn_scale_ports_interface_prefix: osp
ovn_scale_ports_chassis: "{{ inventory_hostname }}"
ovn_scale_ports_network_index: 0
ovn_scale_ports_switch_prefix: lswitch
ovn_scale_ports_switch: ""
ovn_scale_ports_bridge: br-int
ovn_scale_ports_ports: []
ovn_scale_ports_ipv4: true
ovn_scale_ports_ipv6: true
ovn_scale_ports_internal_ipv4: 16.0.0.0/16
ovn_scale_ports_internal_ipv6: 16::/64
ovn_scale_ports_mtu: 0
ovn_scale_ports_wait_for_sb: true
ovn_scale_ports_sb_timeout: 120
ovn_scale_ports_nbctl:
  - ovn-nbctl
ovn_scale_ports_sbctl:
  - ovn-sbctl
ovn_scale_ports_ovs_vsctl:
  - ovs-vsctl
