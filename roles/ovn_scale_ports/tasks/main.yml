- name: Verify OVN scale port configuration
  ansible.builtin.assert:
    that:
      - ovn_scale_ports_id | length > 0
      - ovn_scale_ports_count | int >= 0
      - ovn_scale_ports_start_index | int >= 0
      - ovn_scale_ports_chassis | length > 0
      - ovn_scale_ports_network_index | int >= 0
      - ovn_scale_ports_ports is sequence
      - ovn_scale_ports_ports is not string
      - ovn_scale_ports_mtu | int >= 0
      - ovn_scale_ports_nbctl is sequence
      - ovn_scale_ports_nbctl is not string
      - ovn_scale_ports_nbctl | length > 0
      - ovn_scale_ports_sbctl is sequence
      - ovn_scale_ports_sbctl is not string
      - ovn_scale_ports_sbctl | length > 0
      - ovn_scale_ports_ovs_vsctl is sequence
      - ovn_scale_ports_ovs_vsctl is not string
      - ovn_scale_ports_ovs_vsctl | length > 0
    fail_msg: "Scale ports need a stable ID and valid non-negative counts."

- name: Create temporary scale port state file
  ansible.builtin.tempfile:
    state: file
    suffix: .json
  register: ovn_scale_ports_state

- name: Configure OVN scale ports
  block:
    - name: Generate OVN scale port configuration
      ansible.builtin.script:
        cmd: generate.py
        executable: python3
      environment:
        OVN_SCALE_PORTS_CONFIG: >-
          {{ {
            'id': ovn_scale_ports_id,
            'port_count': ovn_scale_ports_count | int,
            'start_index': ovn_scale_ports_start_index | int,
            'port_prefix': ovn_scale_ports_port_prefix,
            'interface_prefix': ovn_scale_ports_interface_prefix,
            'chassis': ovn_scale_ports_chassis,
            'network_index': ovn_scale_ports_network_index | int,
            'switch_prefix': ovn_scale_ports_switch_prefix,
            'switch': ovn_scale_ports_switch,
            'bridge': ovn_scale_ports_bridge,
            'ports': ovn_scale_ports_ports,
            'ipv4': ovn_scale_ports_ipv4 | bool,
            'ipv6': ovn_scale_ports_ipv6 | bool,
            'internal_ipv4': ovn_scale_ports_internal_ipv4,
            'internal_ipv6': ovn_scale_ports_internal_ipv6,
            'mtu': ovn_scale_ports_mtu | int,
            'nbctl': ovn_scale_ports_nbctl,
            'ovs_vsctl': ovn_scale_ports_ovs_vsctl
          } | to_json }}
        OVN_SCALE_PORTS_OUTPUT: "{{ ovn_scale_ports_state.path }}"
      changed_when: false

    - name: Apply OVN scale ports
      ansible.builtin.script:
        cmd: apply.py
        executable: python3
      environment:
        OVN_SCALE_PORTS_PATH: "{{ ovn_scale_ports_state.path }}"
      changed_when: true

    - name: Wait for scale port Southbound convergence
      ansible.builtin.include_role:
        name: ovn_sb_convergence
      vars:
        ovn_sb_convergence_state_path: "{{ ovn_scale_ports_state.path }}"
        ovn_sb_convergence_timeout: "{{ ovn_scale_ports_sb_timeout }}"
        ovn_sb_convergence_nbctl: "{{ ovn_scale_ports_nbctl }}"
        ovn_sb_convergence_sbctl: "{{ ovn_scale_ports_sbctl }}"
      when: ovn_scale_ports_wait_for_sb | bool
  always:
    - name: Remove temporary scale port state file
      ansible.builtin.file:
        path: "{{ ovn_scale_ports_state.path }}"
        state: absent
