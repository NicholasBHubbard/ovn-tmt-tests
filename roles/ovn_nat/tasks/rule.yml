- name: Find NAT rule {{ ovn_nat_rule.id }}
  ansible.builtin.command:
    argv:
      - ovn-nbctl
      - --bare
      - --columns=_uuid
      - find
      - NAT
      - "external_ids:ovn-tmt-tests-id={{ ovn_nat_rule.id | to_json }}"
  register: ovn_nat_row
  changed_when: false

- name: Verify NAT rule ID is unambiguous {{ ovn_nat_rule.id }}
  ansible.builtin.assert:
    that:
      - ovn_nat_row.stdout_lines | length <= 1
    fail_msg: "NAT rule ID {{ ovn_nat_rule.id }} matches multiple rows."

- name: Find current router for NAT rule {{ ovn_nat_rule.id }}
  when: ovn_nat_row.stdout_lines | length == 1
  ansible.builtin.command:
    argv:
      - ovn-nbctl
      - --bare
      - --columns=name
      - find
      - Logical_Router
      - "nat{>=}{{ ovn_nat_row.stdout }}"
  register: ovn_nat_current_router
  changed_when: false

- name: Verify NAT rule has one router {{ ovn_nat_rule.id }}
  when: ovn_nat_row.stdout_lines | length == 1
  ansible.builtin.assert:
    that:
      - ovn_nat_current_router.stdout_lines | length == 1
    fail_msg: "NAT rule {{ ovn_nat_rule.id }} must belong to exactly one router."

- name: Delete NAT rule {{ ovn_nat_rule.id }}
  when:
    - ovn_nat_rule.state | default('present') == 'absent'
    - ovn_nat_row.stdout_lines | length == 1
  ansible.builtin.command:
    argv:
      - ovn-nbctl
      - remove
      - Logical_Router
      - "{{ ovn_nat_current_router.stdout }}"
      - nat
      - "{{ ovn_nat_row.stdout }}"
  changed_when: true

- name: Record NAT rule deletion {{ ovn_nat_rule.id }}
  when:
    - ovn_nat_rule.state | default('present') == 'absent'
    - ovn_nat_row.stdout_lines | length == 1
  ansible.builtin.set_fact:
    ovn_nat_rules_updated: true
  changed_when: false

- name: Read current NAT rule configuration {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  ansible.builtin.command:
    argv:
      - ovn-nbctl
      - --format=json
      - >-
        --columns={{
          ['type', 'external_ip', 'logical_ip', 'logical_port',
           'external_mac', 'external_port_range', 'gateway_port',
           'allowed_ext_ips', 'exempted_ext_ips', 'match', 'priority',
           'options'] | join(',')
        }}
      - find
      - NAT
      - "external_ids:ovn-tmt-tests-id={{ ovn_nat_rule.id | to_json }}"
  register: ovn_nat_before
  changed_when: false

- name: Initialize references for NAT rule {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  ansible.builtin.set_fact:
    ovn_nat_reference_ids:
      gateway_port: "[]"
      allowed_ext_ips: "[]"
      exempted_ext_ips: "[]"

- name: Resolve references for NAT rule {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  ansible.builtin.include_tasks: reference.yml
  loop:
    - field: gateway_port
      table: Logical_Router_Port
    - field: allowed_ext_ips
      table: Address_Set
    - field: exempted_ext_ips
      table: Address_Set
  loop_control:
    loop_var: ovn_nat_reference
    label: "{{ ovn_nat_reference.field }}"

- name: Initialize update for NAT rule {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  ansible.builtin.set_fact:
    ovn_nat_update_row: >-
      {{ ovn_nat_row.stdout
         if ovn_nat_row.stdout_lines | length == 1
         else '@nat' }}
    ovn_nat_update_argv: >-
      {{ ['ovn-nbctl']
         if ovn_nat_row.stdout_lines | length == 1
         else ['ovn-nbctl', '--id=@nat', 'create', 'NAT'] }}

- name: Add removal from old router for NAT rule {{ ovn_nat_rule.id }}
  when:
    - ovn_nat_rule.state | default('present') == 'present'
    - ovn_nat_row.stdout_lines | length == 1
    - ovn_nat_current_router.stdout != ovn_nat_rule.router
  ansible.builtin.set_fact:
    ovn_nat_update_argv: >-
      {{ ovn_nat_update_argv
         + ['remove', 'Logical_Router', ovn_nat_current_router.stdout,
            'nat', ovn_nat_update_row] }}

- name: Add configuration to NAT rule update {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  ansible.builtin.set_fact:
    ovn_nat_update_argv: >-
      {{ ovn_nat_update_argv
         + (((['--'] if ovn_nat_update_argv | length > 1 else [])
             + ['set', 'NAT', ovn_nat_update_row])
            if ovn_nat_row.stdout_lines | length == 1 else [])
         + ['type=' ~ (ovn_nat_rule.type | to_json),
            'external_ip=' ~ (ovn_nat_rule.external_ip | to_json),
            'logical_ip=' ~ (ovn_nat_rule.logical_ip | to_json),
            'logical_port=' ~ (ovn_nat_rule.logical_port | default([]) | to_json),
            'external_mac=' ~ (ovn_nat_rule.external_mac | default([]) | to_json),
            'external_port_range=' ~ (ovn_nat_rule.external_port_range | default('') | to_json),
            'gateway_port=' ~ ovn_nat_reference_ids.gateway_port,
            'allowed_ext_ips=' ~ ovn_nat_reference_ids.allowed_ext_ips,
            'exempted_ext_ips=' ~ ovn_nat_reference_ids.exempted_ext_ips,
            'match=' ~ (ovn_nat_rule.match | default('') | to_json),
            'priority=' ~ (ovn_nat_rule.priority | default(0) | string)]
         + (['options={}']
            if ovn_nat_row.stdout_lines | length == 1 else [])
         + ['external_ids:ovn-tmt-tests-id=' ~ (ovn_nat_rule.id | to_json)] }}

- name: Add options to NAT rule update {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  ansible.builtin.set_fact:
    ovn_nat_update_argv: >-
      {{ ovn_nat_update_argv
         + ((['--', 'set', 'NAT', ovn_nat_update_row]
             if ovn_nat_row.stdout_lines | length == 1 else [])
            + ['options:' ~ (ovn_nat_option.key | to_json)
               ~ '=' ~ (ovn_nat_option_value | to_json)]) }}
  loop: "{{ ovn_nat_rule.options | default({}) | dict2items }}"
  loop_control:
    loop_var: ovn_nat_option
    label: "{{ ovn_nat_option.key }}"
  vars:
    ovn_nat_option_value: >-
      {{ (ovn_nat_option.value | string | lower)
         if ovn_nat_option.value is boolean
         else (ovn_nat_option.value | string) }}

- name: Add router attachment for NAT rule {{ ovn_nat_rule.id }}
  when:
    - ovn_nat_rule.state | default('present') == 'present'
    - >-
      ovn_nat_row.stdout_lines | length == 0
      or ovn_nat_current_router.stdout != ovn_nat_rule.router
  ansible.builtin.set_fact:
    ovn_nat_update_argv: >-
      {{ ovn_nat_update_argv
         + ['--', 'add', 'Logical_Router', ovn_nat_rule.router,
            'nat', ovn_nat_update_row] }}

- name: Update NAT rule atomically {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  ansible.builtin.command:
    argv: "{{ ovn_nat_update_argv }}"
  changed_when: false

- name: Read updated NAT rule configuration {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  ansible.builtin.command:
    argv:
      - ovn-nbctl
      - --format=json
      - >-
        --columns={{
          ['type', 'external_ip', 'logical_ip', 'logical_port',
           'external_mac', 'external_port_range', 'gateway_port',
           'allowed_ext_ips', 'exempted_ext_ips', 'match', 'priority',
           'options'] | join(',')
        }}
      - find
      - NAT
      - "external_ids:ovn-tmt-tests-id={{ ovn_nat_rule.id | to_json }}"
  register: ovn_nat_after
  changed_when: false

- name: Verify configured NAT rule {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  ansible.builtin.assert:
    that:
      - (ovn_nat_after.stdout | from_json).data | length == 1
    fail_msg: "NAT rule {{ ovn_nat_rule.id }} was not configured unambiguously."

- name: Record NAT rule update {{ ovn_nat_rule.id }}
  when: ovn_nat_rule.state | default('present') == 'present'
  vars:
    ovn_nat_rule_changed: >-
      {{ ovn_nat_before.stdout != ovn_nat_after.stdout
         or ovn_nat_current_router.stdout | default('') != ovn_nat_rule.router }}
  ansible.builtin.set_fact:
    ovn_nat_rules_updated: "{{ ovn_nat_rules_updated or ovn_nat_rule_changed }}"
  changed_when: ovn_nat_rule_changed
