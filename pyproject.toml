[tool.pytest.ini_options]
addopts = "-q -s --import-mode=importlib"

[tool.ruff]
show-fixes = true
target-version = "py39"

[tool.ruff.lint]
extend-select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
]

[tool.ty.environment]
python-version = "3.9"
root = ["tests/lib", "."]
