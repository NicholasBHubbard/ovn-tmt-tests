[tool.pytest.ini_options]
addopts = "-q -s --import-mode=importlib"

[tool.ruff]
line-length = 88
show-fixes = true
target-version = "py39"

[tool.ruff.lint]
extend-select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "B",
    "I",
    "PT",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-row-type = "tuple"
parametrize-values-type = "tuple"

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.9"
root = ["tests/lib", "."]
